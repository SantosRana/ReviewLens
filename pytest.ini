[pytest]
# Automatically add root directory to PYTHONPATH so 'src' imports resolve cleanly
pythonpath = .

# Specify test discovery directory
testpaths = tests

# Define test file naming patterns
python_files = test_*.py

# Custom test markers for selective test execution
markers =
    unit: Unit tests (fast, isolated, no external dependencies)
    agent: Agent reasoning and skill taxonomy tests
    integration: Pipeline integration tests (tool orchestration & state verification)
    regression: Security and logic bug regression tests

# Default CLI execution flags
addopts = 
    -v
    --tb=short
    --strict-markers
    --cov=src
    --cov-report=term-missing

# Filter third-party package deprecation noise
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning